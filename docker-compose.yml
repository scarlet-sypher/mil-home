services:
  postgres:
    image: postgres:16
    container_name: rms-home-postgres
    environment:
      POSTGRES_USER: rms_home
      POSTGRES_PASSWORD: rms_home_dev
      POSTGRES_DB: rms_home
    ports:
      - "5433:5432"
    volumes:
      - rms-home-postgres-data:/var/lib/postgresql/data

volumes:
  rms-home-postgres-data:
